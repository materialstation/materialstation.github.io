<footer class="site-footer">
  <div class="wrap footer-inner">
    <p><strong class="foot-brand">{{ site.Params.brand }} · {{ site.Params.brand_other }}</strong><br>© {{ now.Year }} {{ site.Params.author }} · <span class="mono">{{ site.Params.license }}</span></p>
    <p class="links social">
      {{- range partial "accounts.html" . }}
      <a href="{{ .url }}" {{ if hasPrefix .url "http" }}rel="me noopener" target="_blank"{{ end }} aria-label="{{ .name }}" title="{{ .name }}">{{ partial "icon.html" .icon }}</a>
      {{- end }}
      {{- with site.Home.OutputFormats.Get "rss" }}<a href="{{ .RelPermalink }}" aria-label="RSS" title="RSS">{{ partial "icon.html" "rss" }}</a>{{ end }}
    </p>
  </div>
</footer>
